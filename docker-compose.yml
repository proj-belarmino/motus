services:
  postgres:
    image: postgres:16-alpine
    container_name: motus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motus}
      POSTGRES_USER: ${POSTGRES_USER:-motus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - motus-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motus-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-motus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-motus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-168}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://pasteldemiolos.xyz}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SERVER_PORT: 8080
    volumes:
      - motus_media:/app/media
      - motus_shows:/app/shows
      - motus_thumbnails:/app/thumbnails
      - motus_avatars:/app/avatars
      - motus_subtitles:/app/subtitles
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - motus-network

  frontend:
    build:
      context: ./motus-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: motus-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - motus-network

networks:
  motus-network:
    driver: bridge

volumes:
  postgres_data:
  motus_media:
  motus_shows:
  motus_thumbnails:
  motus_avatars:
  motus_subtitles:
