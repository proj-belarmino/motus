services:
  postgres:
    image: postgres:16-alpine
    container_name: motus-postgres
    environment:
      POSTGRES_DB: onerous-db
      POSTGRES_USER: usuario-usuario
      POSTGRES_PASSWORD: amominhavida
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - motus-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motus-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onerous-db
      SPRING_DATASOURCE_USERNAME: usuario-usuario
      SPRING_DATASOURCE_PASSWORD: amominhavida
    volumes:
      - motus_media:/app/media
      - motus_shows:/app/shows
      - motus_thumbnails:/app/thumbnails
      - motus_avatars:/app/avatars
      - motus_subtitles:/app/subtitles
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - motus-network

  frontend:
    build:
      context: ./motus-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://pasteldemiolos.xyz
    container_name: motus-frontend
    ports:
      - "3000:80" 
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - motus-network

networks:
  motus-network:
    driver: bridge

volumes:
  postgres_data:
  motus_media:
  motus_shows:
  motus_thumbnails:
  motus_avatars:
  motus_subtitles:
