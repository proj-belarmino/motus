spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:motus}
spring.datasource.username=${POSTGRES_USER:motus}
spring.datasource.password=${POSTGRES_PASSWORD:motus}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
server.forward-headers-strategy=framework

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# TMDB metadata enrichment key (optional). Leave empty to disable enrichment.
tmdb.api.key=${TMDB_API_KEY:}

motus.fs.library.path=./media
motus.fs.shows.path=./shows
motus.fs.thumbnails.path=./thumbnails
motus.fs.avatars.path=./avatars

# JWT signing secret. No hardcoded default: JwtService fails fast at startup when
# this is missing or weaker than 32 characters. Generate with: openssl rand -hex 32
motus.security.jwt.secret=${JWT_SECRET:}
motus.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}
# Comma-separated list of allowed browser origins (no wildcards).
motus.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
